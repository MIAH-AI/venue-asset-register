<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Venue Asset Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: floating glossy sidebar (left; bottom dock on phones) + glass top bar; every surface is frosted glass with an embossed top highlight and a glossy sheen. Light = green, lemon, lime, teal. Dark = plum, peach, coral, sage, beige. */
:root{
  --bg:#EDF6EF; --ink:#12261D; --muted:#587066; --line:rgba(20,80,55,.10);
  --glass:rgba(255,255,255,.64); --glass-2:rgba(255,255,255,.84); --glass-edge:rgba(255,255,255,.95); --field:rgba(255,255,255,.78);
  --sheen:rgba(255,255,255,.75); --sheen-end:rgba(255,255,255,0);
  --emboss:inset 0 1px 0 rgba(255,255,255,1), inset 0 -1px 0 rgba(20,110,80,.07), 0 1px 2px rgba(20,100,70,.07), 0 12px 32px -8px rgba(20,110,80,.20);
  --press:inset 0 2px 6px rgba(20,100,70,.14), inset 0 -1px 0 rgba(255,255,255,.9);
  --primary:#17935A; --primary-2:#45C27A; --primary-ink:#FFFFFF; --primary-glow:rgba(23,147,90,.35);
  --side-a:#3DD3AE; --side-b:#119C80; --side-c:#0A6550; --side-ink:rgba(255,255,255,.82);
  --side-active:#FFFFFF; --side-active-ink:#0E8A6C;
  --badge-a:#FFF07A; --badge-b:#E2C514; --badge-ink:#2E2600;
  --c1:#17935A; --c2:#D9B70F; --c3:#6DB51A; --c4:#0E9E9E;
  --ok:#128A4D; --ok-soft:rgba(18,138,77,.12); --warn:#9A7A00; --warn-soft:rgba(226,197,20,.20); --bad:#D33A46; --bad-soft:rgba(211,58,70,.12); --info:#0C8996; --info-soft:rgba(12,137,150,.12); --mute-soft:rgba(20,80,55,.07);
  --glow1:rgba(170,225,60,.32); --glow2:rgba(255,232,90,.34); --streak:rgba(14,158,140,.11);
  --overlay:rgba(10,45,35,.32);
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150C15; --ink:#F3E9DA; --muted:#B9A8A4; --line:rgba(243,233,218,.08);
  --glass:rgba(42,24,42,.58); --glass-2:rgba(56,33,55,.76); --glass-edge:rgba(255,230,215,.10); --field:rgba(0,0,0,.32);
  --sheen:rgba(255,236,220,.07); --sheen-end:rgba(255,236,220,0);
  --emboss:inset 0 1px 0 rgba(255,236,220,.11), inset 0 -1px 0 rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.02), 0 18px 40px -10px rgba(0,0,0,.7);
  --press:inset 0 2px 8px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,236,220,.06);
  --primary:#FF7D69; --primary-2:#FFB68E; --primary-ink:#2A0D10; --primary-glow:rgba(255,125,105,.35);
  --side-a:#9A5596; --side-b:#6F3570; --side-c:#3D1A3E; --side-ink:rgba(243,233,218,.74);
  --side-active:rgba(255,236,220,.17); --side-active-ink:#FFF4E8;
  --badge-a:#C4DFBC; --badge-b:#8DB38A; --badge-ink:#142213;
  --c1:#FFB68E; --c2:#FF7D69; --c3:#9FC39E; --c4:#E4D2B4;
  --ok:#A9D3A2; --ok-soft:rgba(159,195,158,.15); --warn:#FFC390; --warn-soft:rgba(255,182,142,.15); --bad:#FF5E70; --bad-soft:rgba(255,94,112,.15); --info:#D9A6D4; --info-soft:rgba(217,166,212,.15); --mute-soft:rgba(243,233,218,.07);
  --glow1:rgba(255,125,105,.18); --glow2:rgba(159,195,158,.13); --streak:rgba(255,182,142,.20);
  --overlay:rgba(10,0,10,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150C15; --ink:#F3E9DA; --muted:#B9A8A4; --line:rgba(243,233,218,.08);
  --glass:rgba(42,24,42,.58); --glass-2:rgba(56,33,55,.76); --glass-edge:rgba(255,230,215,.10); --field:rgba(0,0,0,.32);
  --sheen:rgba(255,236,220,.07); --sheen-end:rgba(255,236,220,0);
  --emboss:inset 0 1px 0 rgba(255,236,220,.11), inset 0 -1px 0 rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.02), 0 18px 40px -10px rgba(0,0,0,.7);
  --press:inset 0 2px 8px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,236,220,.06);
  --primary:#FF7D69; --primary-2:#FFB68E; --primary-ink:#2A0D10; --primary-glow:rgba(255,125,105,.35);
  --side-a:#9A5596; --side-b:#6F3570; --side-c:#3D1A3E; --side-ink:rgba(243,233,218,.74);
  --side-active:rgba(255,236,220,.17); --side-active-ink:#FFF4E8;
  --badge-a:#C4DFBC; --badge-b:#8DB38A; --badge-ink:#142213;
  --c1:#FFB68E; --c2:#FF7D69; --c3:#9FC39E; --c4:#E4D2B4;
  --ok:#A9D3A2; --ok-soft:rgba(159,195,158,.15); --warn:#FFC390; --warn-soft:rgba(255,182,142,.15); --bad:#FF5E70; --bad-soft:rgba(255,94,112,.15); --info:#D9A6D4; --info-soft:rgba(217,166,212,.15); --mute-soft:rgba(243,233,218,.07);
  --glow1:rgba(255,125,105,.18); --glow2:rgba(159,195,158,.13); --streak:rgba(255,182,142,.20);
  --overlay:rgba(10,0,10,.6); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.55rem;font-weight:800}
h3{font-size:1.02rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* backdrop: glows + light streaks */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:
  radial-gradient(55% 45% at 12% 0%, var(--glow1), transparent 70%),
  radial-gradient(45% 40% at 95% 100%, var(--glow2), transparent 70%),
  var(--bg)}
.bg::before,.bg::after{content:"";position:absolute;inset:-20%;filter:blur(1.5px)}
.bg::before{background:
  linear-gradient(162deg, transparent 38%, var(--streak) 39.2%, transparent 41%),
  linear-gradient(162deg, transparent 44%, var(--streak) 44.6%, transparent 45.6%),
  linear-gradient(18deg, transparent 70%, var(--streak) 71%, transparent 72.5%)}
.bg::after{background:linear-gradient(200deg, transparent 58%, var(--streak) 59%, transparent 61%);opacity:.7}

/* glass primitives */
.glass,.panel,.kpi,.topbar,.btn,.modal,.chip,.seg,.banner,.toolbar input[type=search],.toolbar select{
  background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--emboss);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.panel,.kpi,.topbar,.modal{position:relative}
.panel::before,.kpi::before,.topbar::before,.modal::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,var(--sheen) 0%,var(--sheen-end) 42%)}
.panel > *,.kpi > *,.topbar > *,.modal > *{position:relative}

/* shell */
.side{position:fixed;z-index:30;left:16px;top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:78px;
  border-radius:40px;padding:18px 0;display:flex;flex-direction:column;align-items:center;gap:18px;
  background:linear-gradient(175deg,var(--side-a) 0%,var(--side-b) 45%,var(--side-c) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 2px 0 0 rgba(255,255,255,.18), inset -6px 0 14px rgba(0,0,0,.18), 0 20px 40px -12px var(--primary-glow), 0 8px 24px rgba(40,30,140,.35)}
.side::before{content:"";position:absolute;left:8px;top:36px;bottom:36px;width:10px;border-radius:10px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.04) 60%,rgba(255,255,255,0))}
.side::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 22%)}
.logo{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:.95rem;letter-spacing:.02em;color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 4px rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.2)}
nav.tabs{position:relative;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:center;width:100%;align-items:center}
nav.tabs button{position:relative;width:48px;height:48px;border-radius:15px;border:0;background:transparent;color:var(--side-ink);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,transform .2s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.10)}
nav.tabs button[aria-current="page"]{background:var(--side-active);color:var(--side-active-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 6px 16px rgba(20,10,90,.35)}
nav.tabs .lab{position:absolute;left:62px;top:50%;transform:translateY(-50%) translateX(-4px);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;
  background:var(--glass-2);color:var(--ink);border:1px solid var(--glass-edge);box-shadow:var(--emboss);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font-size:.82rem;font-weight:600;padding:6px 10px;border-radius:10px}
nav.tabs button:hover .lab,nav.tabs button:focus-visible .lab{opacity:1;transform:translateY(-50%)}
nav.tabs .badge{position:absolute;top:2px;right:0;min-width:18px;height:16px;padding:0 5px;border-radius:99px;font-size:.66rem;font-weight:800;line-height:16px;text-align:center;
  background:linear-gradient(180deg,var(--badge-a),var(--badge-b));color:var(--badge-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.3)}
.lab .ls{display:none}
.side-foot{position:relative;font-size:.62rem;color:rgba(255,255,255,.6);font-weight:700;letter-spacing:.08em}

.stage{margin-left:110px;min-width:0;padding-inline:16px 20px;padding-block:16px 60px}
.topbar{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;border-radius:18px;padding:8px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
.crumb{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:12px;font-weight:700;font-size:.88rem;background:var(--glass-2);border:1px solid var(--glass-edge);box-shadow:var(--emboss)}
.crumb .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px var(--primary)}
.org{font-size:.86rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;padding:0 10px;height:38px;border-radius:12px;background:var(--field);border:1px solid var(--line);box-shadow:var(--press)}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:.88rem}
.search kbd{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.seg{display:inline-flex;padding:3px;border-radius:12px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.seg button svg{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--primary-2),var(--primary));color:var(--primary-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px var(--primary-glow)}
.who{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.who:empty{display:none}

main{max-width:1240px;margin:0 auto;padding-block:22px 40px;display:flex;flex-direction:column;gap:20px}
.banner{border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem;border-color:var(--warn-soft)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:64ch;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:8px 14px;font-weight:700;font-size:.86rem;cursor:pointer;min-height:38px;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px);box-shadow:var(--press)}
.btn.primary{background:linear-gradient(180deg,var(--primary-2) 0%,var(--primary) 100%);color:var(--primary-ink);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(0,0,0,.15), 0 8px 18px -4px var(--primary-glow)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.8rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{border-radius:12px;padding:8px 12px;min-height:40px;max-width:100%}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;box-shadow:var(--press);background:var(--field)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:99px;padding:6px 13px;font-size:.82rem;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--primary-2),var(--primary));color:var(--primary-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px var(--primary-glow)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.kpi{border-radius:var(--r);padding:14px 16px 13px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.kpi .l{font-size:.74rem;font-weight:700;color:var(--kc,var(--c1));display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi .l svg{width:16px;height:16px;flex:none}
.kpi .v{font-size:1.65rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;letter-spacing:-.02em}
.kpi .s{font-size:.76rem;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.kpis > .kpi:nth-child(4n+1){--kc:var(--c3)} .kpis > .kpi:nth-child(4n+2){--kc:var(--c1)} .kpis > .kpi:nth-child(4n+3){--kc:var(--c4)} .kpis > .kpi:nth-child(4n+4){--kc:var(--c2)}

.panel{border-radius:var(--r);overflow:hidden;min-width:0}
.panel > .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel > .pb{padding:14px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.ovgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.ovgrid{grid-template-columns:1fr}}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--mute-soft)}
.row .main{min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row.static{cursor:default}
.empty{padding:30px 18px;text-align:center;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-size:1.08rem;font-weight:800}

.tag{font-family:var(--f-mono);font-size:.7rem;font-weight:500;letter-spacing:.04em;color:var(--ink);background:var(--glass-2);border:1px solid var(--line);border-radius:7px;padding:2px 7px;white-space:nowrap;box-shadow:inset 0 1px 0 var(--sheen)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--mute-soft);color:var(--muted)}

table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:700;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

.bar{height:8px;background:var(--mute-soft);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.bar > span{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--bc,var(--primary)) 70%,#fff),var(--bc,var(--primary)));box-shadow:0 0 10px color-mix(in srgb,var(--bc,var(--primary)) 55%,transparent)}
.bar.amber > span{--bc:var(--c2)}

/* overview breakdown + ring */
.brk{display:flex;flex-direction:column;gap:16px;padding:16px 18px 20px}
.brk .it{display:flex;flex-direction:column;gap:7px}
.brk .top{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;font-weight:600}
.brk .top .pc{font-weight:800;color:var(--bc);font-variant-numeric:tabular-nums}
.brk .sub{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ringwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:28px 18px;min-height:280px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:1.7rem;font-weight:800;color:var(--c1);letter-spacing:-.02em}
.ring .val span{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ringwrap p{margin:0;color:var(--muted);font-size:.82rem;max-width:30ch}

/* stock-take counter */
.count-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.count-row.done{background:var(--ok-soft)}
.count-row.short{background:var(--bad-soft)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--field);overflow:hidden;box-shadow:var(--press)}
.stepper button{border:0;background:none;width:40px;height:40px;font-size:1.2rem;font-weight:700;cursor:pointer}
.stepper button:hover{background:var(--mute-soft)}
.stepper input{width:58px;text-align:center;border:0;border-inline:1px solid var(--line);height:40px;background:transparent;font-variant-numeric:tabular-nums;font-weight:700}
.count-ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.count-ctrls select{border:1px solid var(--line);background:var(--field);border-radius:12px;height:42px;padding:0 8px}

/* modal */

@media (min-width:700px){.modal{border-radius:24px}}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);gap:8px}
.modal .mb{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass-2);color:var(--ink);border:1px solid var(--glass-edge);box-shadow:var(--emboss);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;z-index:80;max-width:calc(100% - 32px)}

/* guide */

  background:linear-gradient(170deg,var(--side-a),var(--side-c));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px var(--primary-glow)}

.guide p{margin:0}

.editlist{display:flex;flex-wrap:wrap;gap:6px}
.editlist .x{display:inline-flex;gap:6px;align-items:center;background:var(--mute-soft);border-radius:99px;padding:4px 6px 4px 12px;font-size:.85rem;font-weight:600}
.editlist .x button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:2px 6px}

/* phones: sidebar becomes a glass dock at the bottom */
@media (max-width:820px){
  .side{top:auto;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;height:66px;flex-direction:row;padding:0 8px;border-radius:24px;gap:6px}
  .side::before{left:24px;right:24px;top:6px;bottom:auto;width:auto;height:6px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0))}
  .logo,.side-foot{display:none}
  nav.tabs{flex-direction:row;justify-content:space-between;overflow-x:auto;scrollbar-width:none;gap:2px}

  nav.tabs button{width:auto;min-width:46px;height:54px;padding:4px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;flex:1 0 auto}
  nav.tabs button svg{width:20px;height:20px}
  nav.tabs .lab{position:static;opacity:1;transform:none;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;color:inherit;font-size:.6rem;font-weight:700}
  nav.tabs .badge{top:0;right:2px}

  .stage{margin-left:0;padding-inline:16px;padding-block:12px 110px}
  .org{display:none}
}
/* palette picker */
.palbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 10px;border-radius:12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink)}
.palbtn svg{width:16px;height:16px}
.palbtn .dots{display:inline-flex}
.palbtn .dots i{width:12px;height:12px;border-radius:50%;margin-left:-4px;border:1.5px solid var(--glass-2);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 1px 3px rgba(0,0,0,.25)}
.palintro{margin:0;color:var(--muted);font-size:.88rem}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:12px}
.palcard{position:relative;border-radius:18px;padding:8px 8px 12px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--emboss);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:9px;transition:transform .15s}
.palcard:hover{transform:translateY(-2px)}
.palcard[hidden]{display:none}

.palcard .tick svg{width:13px;height:13px}

/* the stage is a fixed dark backdrop in both themes, like a poster */
.palstage{border-radius:12px;padding:12px 12px 10px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 110%,rgba(255,255,255,.10),transparent 60%),linear-gradient(180deg,#141418,#09090B);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.6)}
.palname{font-weight:800;font-size:1.08rem;line-height:1.05;letter-spacing:-.02em;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
.palname span{text-shadow:0 1px 0 rgba(255,255,255,.25),0 2px 0 rgba(0,0,0,.45),0 3px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.6)}
.palname i{font-style:normal;color:#EDEDF0;opacity:.75;font-size:.8rem}
.palsw{display:flex;align-items:flex-end;padding-left:10px;height:50px}
.sq{width:44px;height:44px;border-radius:13px;margin-left:-10px;background:radial-gradient(110% 80% at 28% 18%,rgba(255,255,255,.5),rgba(255,255,255,0) 52%),var(--sw);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.45),inset 0 -5px 9px rgba(0,0,0,.28),0 8px 14px -4px rgba(0,0,0,.6),0 0 18px -6px var(--sw)}
.sq:nth-child(odd){transform:rotate(-7deg)} .sq:nth-child(even){transform:rotate(6deg) translateY(-5px)}
.palsw.steps .sq{width:30px;height:30px;border-radius:10px;margin-left:-6px}
.palmeta{padding:0 4px;display:flex;flex-direction:column;gap:2px}
.palmeta b{font-size:.86rem}
.palmeta span{font-size:.74rem;color:var(--muted);font-style:italic}
.palmeta code{font-family:var(--f-mono);font-size:.64rem;color:var(--muted);overflow-wrap:anywhere}
.appear{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

    <button type="button" class="palbtn glass" id="palBtn" aria-label="Colour palette"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4-4-7.6-9-7.6z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/></svg><span class="dots" id="palDots"></span><span>Palette</span></button>

      <button type="button" data-theme-set="light" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
      <button type="button" data-theme-set="dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark</button>
    </div>

<script>
(() => {
'use strict';
/* ---------- state ---------- */
const S = { settings: null, assets: [], takes: [], incidents: [], maint: [], supplies: [], orders: [] };
const COL = { assets:'assets', takes:'stocktakes', incidents:'incidents', maint:'maintenance', supplies:'supplies', orders:'orders' };
const loaded = {};
let db = null, user = null, store = null, downloads = null, myId = null, readOnly = false, dbState = 'connecting';
const names = {}; const pendingNames = new Set();

const DEFAULT_LOCATIONS = ['Main Hall','Banquet Hall','Conference Room A','Conference Room B','Boardroom','Reception & Lobby','Kitchen','Restaurant / Bar','Store Room','Generator House','Offices','Toilets','Car Park & Grounds','Security Post'];
const DEFAULT_CATEGORIES = ['Furniture','Electronics & AV','Kitchen Equipment','Electrical & Power','Air Conditioning','Plumbing & Fixtures','Office Equipment','Decor & Soft Furnishing','Security Equipment','Tools & Machinery','Vehicles','Other'];
const CONDITIONS = ['Good','Fair','Poor','Broken'];

const settings = () => S.settings || { orgName:'', currency:'₦', locations:[], categories: DEFAULT_CATEGORIES };

/* ---------- utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + Number(n)); return d.toISOString().slice(0,10); };
const daysUntil = iso => iso ? Math.round((new Date(iso + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5) : null;
const fmtDate = iso => iso ? new Date(iso.length === 10 ? iso + 'T12:00:00' : iso).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '—';
const n = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const moneyShort = v => { try { return settings().currency + new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 }).format(n(v)); } catch (e) { return money(v); } };
const money = v => settings().currency + n(v).toLocaleString(undefined, {maximumFractionDigits: 0});
const plural = (k, w) => `${k.toLocaleString()} ${w}${k === 1 ? '' : 's'}`;
const opts = (list, sel, blank) => (blank != null ? `<option value="">${esc(blank)}</option>` : '') + list.map(o => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('');
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const newTag = cat => ((cat || 'GEN').replace(/[^A-Za-z]/g, '').slice(0,3).toUpperCase() || 'GEN') + '-' + (Date.now().toString(36) + Math.random().toString(36).slice(2,4)).slice(-5).toUpperCase();
const assetById = id => S.assets.find(a => a.id === id);
const assetLabel = a => a ? `${a.tag || ''} ${a.name}`.trim() : 'Unknown item';
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\n');
const who = id => id ? (names[id] || 'Team member') : '—';

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function canWrite() { if (!db) { toast('Saving is unavailable in this view.'); return false; } if (readOnly) { toast('You have view-only access to this register.'); return false; } return true; }

/* asset status, derived */
function assetStatus(a) {
  if (a.state === 'disposed') return { key:'disposed', label:'Disposed', cls:'p-mute' };
  if (a.state === 'repair') return { key:'repair', label:'Under repair', cls:'p-info' };
  const q = n(a.qty), m = n(a.missing);
  if (q > 0 && m >= q) return { key:'missing', label:'Missing', cls:'p-bad' };
  if (m > 0) return { key:'partial', label:`${m} missing`, cls:'p-warn' };
  if (a.condition === 'Broken') return { key:'broken', label:'Broken', cls:'p-warn' };
  return { key:'ok', label:'In place', cls:'p-ok' };
}
const activeAssets = () => S.assets.filter(a => a.state !== 'disposed');

/* ---------- db writes ---------- */
async function put(col, id, data) {
  if (!canWrite()) throw new Error('nowrite');
  try { const ref = id ? db.collection(col).doc(id) : db.collection(col).doc(); await ref.set(data); return ref.id; }
  catch (e) { handleErr(e); throw e; }
}
async function patch(col, id, data) {
  if (!canWrite()) throw new Error('nowrite');
  try { await db.collection(col).doc(id).update(data); } catch (e) { handleErr(e); throw e; }
}
async function remove(col, id) {
  if (!canWrite()) throw new Error('nowrite');
  try { await db.collection(col).doc(id).delete(); } catch (e) { handleErr(e); throw e; }
}
function handleErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') { readOnly = true; toast('That change was not saved. Your access may be view-only.'); }
  else if (c === 'quota_exceeded') toast('Storage is full. Delete old records to add new ones.');
  else if (c === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');
  else toast('Could not save. Check your connection and try again.');
}

/* ---------- names ---------- */
function noteIds(ids) {
  ids.filter(Boolean).forEach(id => { if (!(id in names)) pendingNames.add(id); });
  if (pendingNames.size && user && user.profiles) {
    const batch = [...pendingNames]; pendingNames.clear();
    user.profiles(batch).then(ps => { batch.forEach(id => names[id] = (ps[id] && ps[id].name) || 'Team member'); schedule(); }).catch(() => {});
  }
}

/* ---------- modal ---------- */
function modal(title, body, foot, onMount) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h3 id="mt">${esc(title)}</h3><button class="btn ghost sm" data-close aria-label="Close">✕</button></div>
    <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div></div>`;
  const ov = $('#ov');
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', escClose);
  onMount && onMount(ov);
  const first = ov.querySelector('.mb input, .mb select, .mb textarea'); first && first.focus({preventScroll:true});
  return ov;
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() { $('#modalRoot').innerHTML = ''; document.removeEventListener('keydown', escClose); }
function confirmBox(title, text, okLabel, onOk, danger) {
  modal(title, `<p style="margin:0">${text}</p>`, `<button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="okBtn">${esc(okLabel)}</button>`, ov => {
    $('#okBtn', ov).onclick = async () => { $('#okBtn', ov).disabled = true; try { await onOk(); closeModal(); } catch (e) { $('#okBtn', ov).disabled = false; } };
  });
}

/* ---------- export ---------- */
async function exportFile(filename, rows) {
  const data = toCSV(rows);
  if (downloads) {
    try { await downloads.save({ filename, data }); toast('Export ready'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  modal('Copy export', `<p style="margin:0" class="hint">Downloads aren't available here. Copy this CSV and paste it into Excel or Google Sheets.</p><textarea id="csvOut" style="width:100%;min-height:240px;font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)" readonly>${esc(data)}</textarea>`,
    `<button class="btn primary" id="cp">Copy</button>`, ov => {
      $('#cp', ov).onclick = () => { const ta = $('#csvOut', ov); navigator.clipboard.writeText(ta.value).then(() => toast('Copied'), () => { ta.select(); toast('Press Ctrl+C / long-press to copy'); }); };
    });
}

/* ---------- tabs ---------- */
let cur = 'overview';
const TABS = [
  ['overview','Overview','Home'], ['assets','Assets','Assets'], ['stocktake','Stock-take','Count'], ['incidents','Incidents','Incidents'],
  ['maint','Maintenance','Maintain'], ['supplies','Supplies & orders','Supplies'], ['setup','Guide & setup','Setup']
];
const T = {};
const ICON = {
  overview: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  assets: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  stocktake: '<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1"/><path d="M9 13l2 2 4-4"/>',
  incidents: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M12 8v5"/><path d="M12 16.5v.01"/>',
  maint: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6z"/>',
  supplies: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h11.2L21 7H6.2"/>',
  setup: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  value: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  alert: '<path d="M12 3l9.5 17h-19L12 3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'
};
const svg = (k, cls) => `<svg ${cls ? `class="${cls}"` : ''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k] || ''}</svg>`;
function renderNav() {
  const overdue = S.maint.filter(m => m.status !== 'done' && m.nextDue && daysUntil(m.nextDue) < 0).length;
  const low = S.supplies.filter(s => n(s.onHand) <= n(s.reorderLevel)).length;
  const openInc = S.incidents.filter(i => i.status !== 'Closed').length;
  const openTake = S.takes.filter(t => t.status === 'open').length;
  const badge = { maint: overdue, supplies: low, incidents: openInc, stocktake: openTake };
  $('#tabs').innerHTML = TABS.map(([k, l, sh]) => `<button data-tab="${k}" aria-label="${l}${badge[k] ? ', ' + badge[k] + ' need attention' : ''}" ${k === cur ? 'aria-current="page"' : ''}>${svg(k)}<span class="lab"><span class="lf">${l}</span><span class="ls">${sh}</span></span>${badge[k] ? `<span class="badge">${badge[k]}</span>` : ''}</button>`).join('');
  $('#orgName').textContent = settings().orgName || 'Venue Asset Register';
  $('#crumb').textContent = (TABS.find(t => t[0] === cur) || [, ''])[1];

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function readImport(file) {
  const fr = new FileReader();

    <div class="f wide"><label for="oWhy">Reason</label><input id="oWhy" value="${esc(o.reason || '')}"></div></div>
    ${o.refId ? `<p class="hint" style="margin:0;color:var(--muted);font-size:.86rem">Setting the status to Received ${o.kind === 'asset' ? 'reduces the missing count on the register record' : 'adds the quantity to stock on hand'}.</p>` : ''}`,
    `${!isNew ? '<button class="btn danger" id="oDel" style="margin-right:auto">Delete</button>' : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="oSave">Save</button>`, ov => {
      const del = $('#oDel', ov); if (del) del.onclick = () => confirmBox('Delete this request?', '', 'Delete', () => remove(COL.orders, o.id), true);
      $('#oSave', ov).onclick = async () => {
        const label = val('oLab'); if (!label) return toast('Name the item.');
        const status = val('oStat'); const qty = Math.max(1, n(val('oQty')));
        const nowReceived = status === 'Received' && o.status !== 'Received';
        const data = Object.assign({}, o, { label, qty, estCost: val('oCost') === '' ? null : n(val('oCost')), status, supplier: val('oSup'), reason: val('oWhy'), updatedAt: new Date().toISOString(), history: [...(o.history || []), ...(status !== o.status || isNew ? [{ status, at: new Date().toISOString(), by: myId }] : [])].slice(-20) });
        delete data.id; if (isNew) { data.requestedAt = new Date().toISOString(); data.requestedBy = myId; }
        $('#oSave', ov).disabled = true;
        try {
          await put(COL.orders, o.id, data);
          if (nowReceived && o.refId) {
            if (o.kind === 'supply') { const s = S.supplies.find(x => x.id === o.refId); if (s) await patch(COL.supplies, s.id, { onHand: n(s.onHand) + qty, moves: [...(s.moves || []), { date: today(), delta: qty, note: 'Received: purchase request', by: myId }].slice(-40) }); }
            else { const a = assetById(o.refId); if (a) await patch(COL.assets, a.id, { missing: Math.max(0, n(a.missing) - qty) }); }
          }
          closeModal(); toast('Saved');
        } catch (e) { $('#oSave', ov).disabled = false; }
      };
    });
}
function replaceMissing() {
  const M = activeAssets().filter(a => n(a.missing) > 0 && !S.orders.some(o => o.refId === a.id && !['Received','Cancelled'].includes(o.status)));
  if (!M.length) return toast('No missing items without a pending order.');
  modal('Replace missing items', `<p style="margin:0">Tick the items to request replacements for. Quantities default to the units missing.</p>
    <div class="mini-list">${M.map(a => `<label class="it" style="cursor:pointer"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" value="${a.id}" checked> ${esc(a.name)} · ${esc(a.location || '')}</span><span class="num">${n(a.missing)} × ${money(a.unitValue)}</span></label>`).join('')}</div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="rmGo">Create requests</button>`, ov => {
      $('#rmGo', ov).onclick = async () => {
        $('#rmGo', ov).disabled = true;
        try { for (const cb of $$('input:checked', ov)) { const a = assetById(cb.value); await put(COL.orders, null, { kind: 'asset', refId: a.id, label: a.name, qty: n(a.missing), estCost: n(a.missing) * n(a.unitValue), status: 'Requested', reason: `Replace missing (${a.tag}, ${a.location || ''})`, requestedAt: new Date().toISOString(), requestedBy: myId, history: [] }); } closeModal(); toast('Requests created'); }
        catch (e) { $('#rmGo', ov).disabled = false; }
      };
    });
}

/* =========================================================
   GUIDE & SETUP
   ========================================================= */
T.setup = {
  shell(m) {
    m.insertAdjacentHTML('beforeend', `
      <div class="grid2" style="align-items:start">
      <div class="panel"><div class="ph"><h3>How to run the first stock-take</h3></div><div class="pb guide">
        <ol>
          <li><div><b>Secure the building first.</b><p>Change or add locks on stores and AV rooms, brief the guards, and log any losses already discovered as incidents before counting.</p></div></li>
          <li><div><b>Freeze movement.</b><p>No item leaves or moves between rooms until the count is closed. Anything that must move is noted.</p></div></li>
          <li><div><b>Map the zones.</b><p>Add every room, store and outdoor area under Locations below. Each becomes a counting zone.</p></div></li>
          <li><div><b>Register as you walk.</b><p>Teams of two per zone: one counts and tags, the other records on a phone. Add each item with its location, quantity, condition and a photo. Write the tag number on the item with a marker or sticker.</p></div></li>
          <li><div><b>Start a stock-take.</b><p>Once a zone is registered, open a stock-take for it. A different pair recounts, tapping “All” or entering what they actually see.</p></div></li>
          <li><div><b>Recount the gaps.</b><p>Filter by “Short”. Search the building for those items before accepting the loss.</p></div></li>
          <li><div><b>Reconcile and close.</b><p>Closing updates the register and logs one incident listing every shortage with its value, ready for police and insurance.</p></div></li>
          <li><div><b>Repeat on a cycle.</b><p>A full count monthly while security is uncertain, then quarterly. Spot-check high-value rooms weekly.</p></div></li>
        </ol>
        <div><div class="lbl">Record for every item</div><ul><li>Name, make/model and serial number (TVs, projectors, generators, ACs)</li><li>Exact location and quantity</li><li>Condition: Good, Fair, Poor or Broken</li><li>Replacement value, so losses can be totalled</li><li>A photo and any distinguishing marks</li></ul></div>
      </div></div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="panel"><div class="ph"><h3>Appearance</h3></div><div class="pb appear"><span style="flex:1;min-width:0"><span class="lbl">Colour palette</span><br><b id="appearName"></b></span><button class="btn" id="gPal">Change palette</button></div></div>
        <div class="panel"><div class="ph"><h3>Venue details</h3></div><div class="pb fields">
          <div class="f wide"><label for="gOrg">Venue name</label><input id="gOrg" placeholder="e.g. Grand Pavilion Conference Centre"></div>
          <div class="f"><label for="gCur">Currency symbol</label><input id="gCur" maxlength="4"></div>
          <div class="f" style="justify-content:flex-end"><button class="btn primary" id="gSave">Save details</button></div></div></div>
        <div class="panel"><div class="ph"><h3>Locations</h3><button class="btn sm" id="gDef">Add typical areas</button></div><div class="pb" style="display:flex;flex-direction:column;gap:10px"><div class="editlist" id="gLocs"></div>
          <div class="toolbar"><input type="search" id="gLocIn" placeholder="New location, e.g. Hall B Store" style="flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)"><button class="btn sm" id="gLocAdd">Add</button></div></div></div>
        <div class="panel"><div class="ph"><h3>Categories</h3></div><div class="pb" style="display:flex;flex-direction:column;gap:10px"><div class="editlist" id="gCats"></div>
          <div class="toolbar"><input type="search" id="gCatIn" placeholder="New category" style="flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)"><button class="btn sm" id="gCatAdd">Add</button></div></div></div>
        <div class="panel"><div class="ph"><h3>Sharing with staff</h3></div><div class="pb" style="font-size:.9rem;display:flex;flex-direction:column;gap:6px">
          <p style="margin:0">Share this page with your team. Give counters <b>Contributor</b> access so they can record counts; managers who change setup need <b>Editor</b>. Every count is stamped with who recorded it.</p></div></div>
      </div></div>`);
    const saveSettings = async patchObj => { const cur = settings(); try { await put('config', 'main', Object.assign({}, cur, patchObj)); } catch (e) {} };
    this.save = saveSettings;
    $('#gPal').onclick = openPalettes; applyPalette(palId);
    $('#gSave').onclick = async () => { await saveSettings({ orgName: val('gOrg'), currency: val('gCur') || '₦' }); toast('Saved'); };
    $('#gDef').onclick = () => { const cur = settings().locations; saveSettings({ locations: [...new Set([...cur, ...DEFAULT_LOCATIONS])] }); };
    const addTo = (key, inp) => { const v = val(inp); if (!v) return; $('#' + inp).value = ''; const cur = settings()[key] || []; if (!cur.includes(v)) saveSettings({ [key]: [...cur, v] }); };
    $('#gLocAdd').onclick = () => addTo('locations', 'gLocIn'); $('#gLocIn').onkeydown = e => { if (e.key === 'Enter') addTo('locations', 'gLocIn'); };
    $('#gCatAdd').onclick = () => addTo('categories', 'gCatIn'); $('#gCatIn').onkeydown = e => { if (e.key === 'Enter') addTo('categories', 'gCatIn'); };
    m.addEventListener('click', e => { const b = e.target.closest('[data-rmset]'); if (b) { const [key, v] = [b.dataset.rmset, b.dataset.v]; saveSettings({ [key]: settings()[key].filter(x => x !== v) }); } });
    this.filled = false;
  },
  update() {
    const st = settings();
    if (!this.filled && (S.settings || loaded.settings)) { $('#gOrg').value = st.orgName || ''; $('#gCur').value = st.currency || '₦'; this.filled = true; }
    else if (!this.filled) { $('#gCur').value = st.currency; }
    const used = k => S.assets.filter(a => a.location === k).length;
    $('#gLocs').innerHTML = st.locations.length ? st.locations.map(l => `<span class="x">${esc(l)} <span class="num" style="color:var(--muted);font-size:.78rem">${used(l) || ''}</span><button data-rmset="locations" data-v="${esc(l)}" aria-label="Remove ${esc(l)}">×</button></span>`).join('') : `<span style="color:var(--muted);font-size:.88rem">No locations yet. Add each hall, room, store and outdoor area, or start from the typical list.</span>`;
    $('#gCats').innerHTML = st.categories.map(c => `<span class="x">${esc(c)}<button data-rmset="categories" data-v="${esc(c)}" aria-label="Remove ${esc(c)}">×</button></span>`).join('');
  }
};

/* ---------- boot ---------- */
let saved = 'overview'; try { saved = localStorage.getItem('var-tab') || 'overview'; } catch (e) {}
if (!T[saved]) saved = 'overview';
go(saved);

(async () => {
  const use = name => (window.claude && window.claude.use) ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
  [db, user, downloads, store] = await Promise.all([use('db'), use('user'), use('downloads'), use('assets')]);
  if (!db) { dbState = 'off'; const b = $('#dbBanner'); if (b) b.textContent = 'The shared register can’t be reached in this view. Open this page while signed in to claude.ai to see and record items.'; return; }
  if (user) {
    try { myId = await user.id(); } catch (e) {}
    try { const me = await user.me(); if (me && me.id) { myId = myId || me.id; names[me.id] = me.name || 'You'; $('#who').textContent = me.name ? 'Signed in as ' + me.name : ''; } } catch (e) {}
    try { const cw = await user.can('data.write'); if (cw === false) { readOnly = true; $('#who').textContent += ' · view only'; } } catch (e) {}
  }
  const onErr = e => { if (e && (e.code === 'revoked')) { dbState = 'off'; } };
  db.doc('config/main').onSnapshot(s => { S.settings = s.exists ? Object.assign({ orgName:'', currency:'₦', locations:[], categories: DEFAULT_CATEGORIES }, s.data()) : null; loaded.settings = true; schedule(); }, onErr);
  const keys = { assets:'assets', takes:'takes', incidents:'incidents', maint:'maint', supplies:'supplies', orders:'orders' };
  Object.keys(keys).forEach(k => db.collection(COL[k]).onSnapshot(snap => {
    S[k] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); loaded[k] = true;
    if (k === 'assets') noteIds(S.assets.map(a => a.createdBy));
    schedule();
  }, onErr));
  dbState = 'ready'; const b = $('#dbBanner'); if (b) b.remove();
})();
})();
</script>
